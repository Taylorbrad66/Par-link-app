<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
const APP_KEY='parlink.v1';
const APP_VERSION='1.4';
const now=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

const defaultHoles=()=>Array.from({length:18},(_,i)=>({number:i+1,par:[4,4,3,5,4,3,4,5,4,4,4,3,5,4,3,4,5,4][i],si:[7,3,15,1,9,17,5,11,13,8,4,16,2,10,18,6,12,14][i],lat:null,lng:null}));
const initialState={
  view:'home',
  profile:{name:'Brad',handicap:18,officialHandicap:18,courseCredits:2,photo:null,suburb:'',homeCourse:'',playingStyle:'Social',availability:['Saturday','Sunday'],discoverable:false,showHandicap:true,clubs:[
    {name:'Driver',carry:210},{name:'3 Wood',carry:190},{name:'5 Wood',carry:175},{name:'4 Iron',carry:165},{name:'5 Iron',carry:155},{name:'6 Iron',carry:145},{name:'7 Iron',carry:135},{name:'8 Iron',carry:125},{name:'9 Iron',carry:115},{name:'PW',carry:100},{name:'SW',carry:80}
  ]},
  players:[
    {id:'brad',name:'Brad',handicap:18,photo:null},{id:'paul',name:'Paul',handicap:18,photo:null},{id:'andrew',name:'Andrew',handicap:18,photo:null},{id:'wayne',name:'Wayne',handicap:18,photo:null}
  ],
  courses:[{id:'demo',name:'ParLink Demo Course',location:'Demo only',activated:true,isDemo:true,scratchRating:72,slopeRating:113,pcc:0,holes:defaultHoles(),createdAt:now()}],
  rounds:[],activeRound:null,
  groups:[{id:'default-group',name:'Saturday Crew',playerIds:['brad','paul','andrew','wayne'],createdAt:now()}],
  openRounds:[],
  gpsPlus:false
};
let state=load();
let modal=null;
let gpsWatchId=null;
let gpsPosition=null;

function load(){
  try{const v=JSON.parse(localStorage.getItem(APP_KEY));return v?mergeDefaults(v):structuredClone(initialState)}catch{return structuredClone(initialState)}
}
function mergeDefaults(v){
  const merged={...structuredClone(initialState),...v,profile:{...initialState.profile,...(v.profile||{})},players:v.players?.length?v.players:structuredClone(initialState.players),courses:v.courses?.length?v.courses:structuredClone(initialState.courses),rounds:v.rounds||[],groups:Array.isArray(v.groups)?v.groups:structuredClone(initialState.groups),openRounds:Array.isArray(v.openRounds)?v.openRounds:[]};
  merged.players=merged.players.map(p=>({...p,photo:p.photo||null}));
  if(merged.profile.officialHandicap==null)merged.profile.officialHandicap=Number(merged.profile.handicap||0);
  if(merged.profile.photo==null)merged.profile.photo=merged.players.find(p=>p.id==='brad')?.photo||null;
  const own=merged.players.find(p=>p.id==='brad');if(own&&!own.photo&&merged.profile.photo)own.photo=merged.profile.photo;
  merged.courses=merged.courses.map(c=>({...c,scratchRating:Number(c.scratchRating??parTotalSafe(c)),slopeRating:Number(c.slopeRating??113),pcc:Number(c.pcc??0)}));
  return merged;
}
function parTotalSafe(course){return (course?.holes||[]).reduce((a,h)=>a+Number(h.par||0),0)||72}

function save(){localStorage.setItem(APP_KEY,JSON.stringify(state))}
function setView(v){state.view=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function initials(name){return name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function fmtDate(s){return new Date(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function courseById(id){return state.courses.find(c=>c.id===id)}
function playerById(id){return state.players.find(p=>p.id===id)}
function avatarHtml(player,size=''){const p=typeof player==='string'?playerById(player):player;const cls=size==='lg'?'avatar-lg':'avatar';if(p?.photo)return `<div class="${cls}"><img src="${p.photo}" alt="${esc(p.name)}"></div>`;return `<div class="${cls}">${initials(p?.name||'?')}</div>`}
function defaultShotStat(){return {fairway:'na',gir:false,putts:null,chips:0,sand:0,penalties:0}}
function ensureRoundStats(r){if(!r)return;r.stats=r.stats||{};(r.playerIds||[]).forEach(pid=>{if(!Array.isArray(r.stats[pid]))r.stats[pid]=Array.from({length:18},()=>defaultShotStat());while(r.stats[pid].length<18)r.stats[pid].push(defaultShotStat());r.stats[pid]=r.stats[pid].map(x=>({...defaultShotStat(),...(x||{})}))})}
function summarizeShotStats(stats=[]){const s=stats.filter(Boolean);const fw=s.filter(x=>x.fairway&&x.fairway!=='na');const hit=fw.filter(x=>x.fairway==='hit').length;const gir=s.filter(x=>x.gir===true).length;const putts=s.reduce((a,x)=>a+(Number.isFinite(Number(x.putts))?Number(x.putts):0),0);const chips=s.reduce((a,x)=>a+Number(x.chips||0),0);const sand=s.reduce((a,x)=>a+Number(x.sand||0),0);const penalties=s.reduce((a,x)=>a+Number(x.penalties||0),0);return {fairwaysHit:hit,fairwayOpportunities:fw.length,gir,holes:s.length,putts,chips,sand,penalties}}
function playerRoundSummary(r,pid){const res=(r.results||[]).find(x=>x.playerId===pid);if(res?.statsSummary)return res.statsSummary;if(r.stats?.[pid])return summarizeShotStats(r.stats[pid]);return null}
function statsRecorded(stat){return stat&&(stat.fairway!=='na'||stat.gir||stat.putts!=null||stat.chips||stat.sand||stat.penalties)}
function courseCenter(c){const pts=(c?.holes||[]).filter(h=>Number.isFinite(Number(h.lat))&&Number.isFinite(Number(h.lng)));if(!pts.length)return null;return {lat:pts.reduce((a,h)=>a+Number(h.lat),0)/pts.length,lng:pts.reduce((a,h)=>a+Number(h.lng),0)/pts.length}}
function distanceToCourse(c){if(!gpsPosition)return null;const ctr=courseCenter(c);return ctr?Math.round(haversine(gpsPosition.latitude,gpsPosition.longitude,ctr.lat,ctr.lng)):null}
function nearestCourse(){if(!gpsPosition)return null;return activeCourses().map(c=>({c,d:distanceToCourse(c)})).filter(x=>x.d!=null).sort((a,b)=>a.d-b.d)[0]||null}
function activeCourses(){return state.courses.filter(c=>c.activated||c.isDemo)}
function activatedPaidCount(){return state.courses.filter(c=>c.activated&&!c.isDemo).length}
function creditsLeft(){return Math.max(0,(state.profile.courseCredits||2)-activatedPaidCount())}
function parTotal(course){return course.holes.reduce((a,h)=>a+Number(h.par||0),0)}
function round1(n){return Math.round((Number(n)+Number.EPSILON)*10)/10}
function handicapScoreCountRule(n){
  if(n<3)return {count:0,adjustment:0};
  if(n===3)return {count:1,adjustment:-2};
  if(n===4)return {count:1,adjustment:-1};
  if(n===5)return {count:1,adjustment:0};
  if(n===6)return {count:2,adjustment:-1};
  if(n<=8)return {count:2,adjustment:0};
  if(n<=11)return {count:3,adjustment:0};
  if(n<=14)return {count:4,adjustment:0};
  if(n<=16)return {count:5,adjustment:0};
  if(n<=18)return {count:6,adjustment:0};
  if(n===19)return {count:7,adjustment:0};
  return {count:8,adjustment:0};
}
function scoreDifferential(points,dailyHandicap,course){
  if(!course)return null;
  const par=parTotal(course),scratch=Number(course.scratchRating??par),slope=Number(course.slopeRating??113),pcc=Number(course.pcc??0);
  if(!Number.isFinite(slope)||slope<=0)return null;
  return round1(((36-Number(points||0))+Number(dailyHandicap||0)+par-(scratch+pcc))*(113/slope));
}
function handicapEntries(playerId='brad',rounds=state.rounds){
  return (rounds||[]).filter(r=>r.format!=='ambrose').map(r=>{
    const result=(r.results||[]).find(x=>x.playerId===playerId);if(!result)return null;
    const course=courseById(r.courseId)||{holes:Array.from({length:18},()=>({par:4})),scratchRating:r.scratchRating||72,slopeRating:r.slopeRating||113,pcc:r.pcc||0};
    let differential=result.scoreDifferential;
    if(differential==null){
      const hcp=result.handicapUsed??playerById(playerId)?.handicap??state.profile.officialHandicap??state.profile.handicap??0;
      differential=scoreDifferential(result.points,hcp,course);
    }
    return differential==null?null:{roundId:r.id,date:r.completedAt,courseName:r.courseName||course.name||'Course',differential:round1(differential)};
  }).filter(Boolean).slice(-20);
}
function estimateHandicap(playerId='brad',rounds=state.rounds){
  const entries=handicapEntries(playerId,rounds),n=entries.length,rule=handicapScoreCountRule(n);
  if(!rule.count)return {value:null,status:n?`${n} qualifying round${n===1?'':'s'} · need 3`:'Need 3 qualifying rounds',entries,used:[]};
  const sorted=[...entries].sort((a,b)=>a.differential-b.differential),used=sorted.slice(0,rule.count);
  const avg=used.reduce((a,x)=>a+x.differential,0)/used.length;
  const value=Math.min(54,round1(avg+rule.adjustment));
  return {value,status:`${n} qualifying rounds · lowest ${rule.count}${rule.adjustment?` · ${rule.adjustment.toFixed(1)} adjustment`:''}`,entries,used};
}
function handicapTrend(playerId='brad'){
  const all=state.rounds.filter(r=>r.format!=='ambrose'&&(r.results||[]).some(x=>x.playerId===playerId));
  return all.map((_,i)=>estimateHandicap(playerId,all.slice(0,i+1)).value).filter(v=>v!=null);
}
function handicapSparkline(values){
  if(!values?.length)return '';
  const w=300,h=84,p=8,min=Math.min(...values),max=Math.max(...values),span=Math.max(1,max-min);
  const pts=values.map((v,i)=>`${p+(i*(w-2*p)/Math.max(1,values.length-1))},${p+((v-min)/span)*(h-2*p)}`).join(' ');
  return `<svg class="hcp-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Estimated handicap trend"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function nav(){
  const items=[['home','⌂','Home'],['play','⛳','Golf'],['stats','▥','Stats'],['mates','♟','Mates'],['profile','●','Profile']];
  return `<nav class="bottom-nav"><div class="nav-inner">${items.map(([v,i,l])=>`<button class="nav-btn ${state.view===v?'active':''}" data-nav="${v}"><span>${i}</span><span>${l}</span></button>`).join('')}</div></nav>`;
}
function header(title='ParLink'){
  return `<header class="header"><div class="brand"><div class="brand-mark">PL</div><div>${esc(title)}</div></div><div class="header-actions"><button class="icon-btn" data-action="install">＋</button></div></header>`;
}
function shell(content,title='ParLink'){return `<main class="shell">${header(title)}${content}</main>${nav()}`}

function homeView(){
  const last=state.rounds.at(-1);
  const best=bestRound();
  const hcp=estimateHandicap('brad');
  return shell(`
    <section class="hero"><div class="eyebrow">ParLink V1.4</div><h1>Know your game.<br>Beat your mates.<br>Beat yourself.</h1><p>Score rounds, build your stats, challenge a phantom and get simple club advice without a compulsory subscription.</p></section>
    <div class="grid">
      <button class="card" data-go="play"><div class="emoji">⛳</div><h3>Play</h3><p>Stroke, Stableford and Ambrose.</p></button>
      <button class="card" data-go="phantom"><div class="emoji">👻</div><h3>Phantom</h3><p>Play against your best or last round.</p></button>
      <button class="card" data-go="mates"><div class="emoji">🏆</div><h3>Compete</h3><p>Mates, winners and round history.</p></button>
      <button class="card" data-go="caddie"><div class="emoji">🧠</div><h3>Caddie</h3><p>Club advice from your own carry numbers.</p></button>
    </div>
    <section class="section"><div class="section-title"><h2>Your ParLink</h2><span>${creditsLeft()} course credits left</span></div>
      <div class="kpis"><div class="kpi"><div class="value">${state.rounds.length}</div><div class="label">Rounds</div></div><div class="kpi"><div class="value">${activeCourses().length}</div><div class="label">Courses</div></div><div class="kpi"><div class="value">${best?bestSummary(best):'—'}</div><div class="label">Best</div></div><div class="kpi"><div class="value">${hcp.value??'—'}</div><div class="label">ParLink HCP</div></div></div>
    </section>
    ${last?`<section class="section"><div class="section-title"><h2>Last round</h2><span>${fmtDate(last.completedAt)}</span></div>${roundCard(last)}</section>`:''}
    <section class="section"><div class="callout"><strong>V1 runs locally.</strong> Your rounds, courses and player data stay on this device. No Lovable account or paid backend is required.</div></section>
  `);
}
function bestSummary(r){const p=r.results?.[0];if(!p)return '—';return r.format==='stableford'?`${p.points} pts`:`${p.toPar>0?'+':''}${p.toPar}`}
function roundCard(r){
  const c=courseById(r.courseId);const lead=r.results?.[0];
  const result=lead?(r.format==='stableford'?lead.points+' pts':(lead.toPar>0?'+':'')+lead.toPar):'Saved';
  return `<div class="list-item round-history-item"><div><strong>${esc(c?.name||r.courseName||'Course')}</strong><div class="meta">${esc(r.format)} · ${r.players.length} player${r.players.length!==1?'s':''}</div></div><div class="round-actions"><span class="badge ${r.format==='stableford'?'blue':''}">${result}</span><button class="share-mini" data-share-round="${r.id}" aria-label="Share round">↗ Share</button></div></div>`}

function playView(){
  if(state.activeRound){ensureRoundStats(state.activeRound);return roundView()}
  const near=nearestCourse();
  return shell(`
    <div class="section-title"><h2>Start a round</h2><span>${activeCourses().length} available courses</span></div>
    <div class="location-card"><div class="location-state"><span class="location-dot ${gpsPosition?'on':''}"></span><div><strong>${gpsPosition?'Location ready':'Location optional'}</strong><div class="meta">${gpsPosition?(near?`${esc(near.c.name)} about ${near.d<1000?near.d+' m':(near.d/1000).toFixed(1)+' km'} away`:`Accuracy about ${Math.round(gpsPosition.accuracy||0)} m`):'Used only to find nearby saved courses and GPS distances.'}</div></div></div><button class="btn btn-secondary" data-action="locate-course">${gpsPosition?'Refresh':'Use my location'}</button></div>
    <div class="privacy-note"><span>🔒</span><span>ParLink does not save your exact current coordinates to your profile. Location is requested when you choose to use GPS features.</span></div>
    <div class="form-card" style="margin-top:14px">
      <div class="field"><label>Course</label><select id="round-course">${activeCourses().map(c=>{const d=distanceToCourse(c);return `<option value="${c.id}" ${near?.c.id===c.id?'selected':''}>${esc(c.name)}${c.isDemo?' · demo':''}${d!=null?` · ${d<1000?d+' m':(d/1000).toFixed(1)+' km'}`:''}</option>`}).join('')}</select></div>
      <div class="field"><label>Format</label><div class="segmented" id="format-tabs">${['stroke','stableford','ambrose'].map((f,i)=>`<button class="seg ${i===0?'active':''}" data-format="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div>
      <div class="field"><label>Players</label><div class="player-pills">${state.players.map((p,i)=>`<button class="pill ${i===0?'active':''}" data-player-select="${p.id}" style="display:inline-flex;align-items:center;gap:7px">${avatarHtml(p)}<span>${esc(p.name)} · ${p.handicap}</span></button>`).join('')}</div></div>
      <button class="btn btn-primary" style="width:100%" data-action="start-round">Start round</button>
    </div>
    <section class="section"><div class="section-title"><h2>Course library</h2><span>${creditsLeft()} of ${state.profile.courseCredits} credits unused</span></div>
      <div class="btn-row"><button class="btn btn-secondary" data-action="new-course">＋ Add course</button><button class="btn btn-secondary" data-action="import-course">Import JSON</button></div>
      <div class="list" style="margin-top:10px">${state.courses.map(courseCard).join('')}</div>
    </section>
  `,'Golf');
}
function courseCard(c){return `<div class="list-item"><div><strong>${esc(c.name)}</strong><div class="meta">${esc(c.location||'')} · Par ${parTotal(c)} · SR ${Number(c.scratchRating??parTotal(c)).toFixed(1)} · Slope ${Number(c.slopeRating??113)}</div></div><div>${c.isDemo?'<span class="badge blue">Demo</span>':c.activated?'<span class="badge">Activated</span>':`<button class="btn btn-secondary" data-activate-course="${c.id}" ${creditsLeft()<=0?'disabled':''}>Use credit</button>`}</div></div>`}

function startRound(){

function openRoundCourseName(or){return or.courseId?courseById(or.courseId)?.name||or.courseName||'Course':or.courseName||'Course'}
function openRoundDate(or){if(!or.date)return 'Date TBC';try{return new Date(or.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}catch{return or.date}}

function openRoundInvited(or){return Object.keys(or.statuses||{})}

function newGroupModal(id=null){const g=id?state.groups.find(x=>x.id===id):null;window.__editingGroup=id;modal=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="section-title"><h2>${g?'Edit group':'New group'}</h2><button class="icon-btn" data-action="close-modal">✕</button></div><div class="field"><label>Group name</label><input id="group-name" value="${esc(g?.name||'')}" placeholder="e.g. Saturday Crew"></div><div class="field"><label>Members</label><div class="invite-grid">${state.players.map(p=>`<label class="invite-row">${avatarHtml(p)}<span>${esc(p.name)}<div class="meta">HCP ${p.handicap}</div></span><input type="checkbox" data-group-player="${p.id}" ${(g?.playerIds||['brad']).includes(p.id)?'checked':''}></label>`).join('')}</div></div><div class="btn-row"><button class="btn btn-primary" data-action="save-group">Save group</button>${g&&g.id!=='default-group'?'<button class="btn btn-danger" data-action="delete-group">Delete</button>':''}</div></div></div>`;render()}

    <section class="section"><div class="section-title"><h2>Location</h2><span>Only when needed</span></div><div class="location-card"><div class="location-state"><span class="location-dot ${gpsPosition?'on':''}"></span><div><strong>${gpsPosition?'Location active':'Location off'}</strong><div class="meta">${gpsPosition?`Accuracy about ${Math.round(gpsPosition.accuracy||0)} m`:'Used for nearby saved courses and GPS distances.'}</div></div></div><button class="btn btn-secondary" data-action="locate-course">${gpsPosition?'Refresh':'Use location'}</button></div><div class="privacy-note"><span>📍</span><span>ParLink asks for location when you choose a GPS feature, not as a compulsory sign-up requirement.</span></div></section>
    <section class="section"><div class="section-title"><h2>Handicap tracking</h2><span>ParLink estimate</span></div>${(()=>{const h=estimateHandicap('brad');return `<div class="list-item"><div><strong>${h.value==null?'Not enough rounds':h.value.toFixed(1)}</strong><div class="meta">${esc(h.status)}</div></div><button class="btn btn-secondary" data-nav="stats">View details</button></div>`})()}</section>
    <section class="section"><div class="section-title"><h2>Club distances</h2><span>Carry metres</span></div><div class="list">${state.profile.clubs.map((c,i)=>`<div class="list-item"><input class="club-name" data-i="${i}" value="${esc(c.name)}" style="max-width:150px"><input class="club-carry" data-i="${i}" type="number" value="${c.carry}" style="max-width:100px"></div>`).join('')}</div><div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" data-action="save-clubs">Save clubs</button><button class="btn btn-secondary" data-action="add-club">＋ Add club</button></div></section>
    <section class="section"><div class="section-title"><h2>Course plan</h2><span>${creditsLeft()} credits left</span></div><div class="callout"><strong>2 course credits included.</strong> Demo courses do not consume a credit. Activating a user-added course uses one credit in this prototype.</div></section>
    <section class="section"><div class="section-title"><h2>GPS+</h2><span>Prototype switch</span></div><div class="list-item"><div><strong>GPS+ access</strong><div class="meta">Future paid plan for unlimited courses and richer GPS.</div></div><button class="btn ${state.gpsPlus?'btn-primary':'btn-secondary'}" data-action="toggle-gpsplus">${state.gpsPlus?'Enabled':'Enable demo'}</button></div></section>
    <section class="section"><div class="callout warning"><strong>Watch companion is next-stage.</strong> Wear OS and Apple Watch scoring/GPS require a companion app and are not simulated in V1.4.</div></section>
    <section class="section"><button class="btn btn-danger" data-action="reset-app">Reset all ParLink V1.4 data</button></section>
  `,'Profile');
}

function newCourseModal(){
  modal=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="section-title"><h2>Add course</h2><button class="icon-btn" data-action="close-modal">✕</button></div><div class="field"><label>Course name</label><input id="course-name" placeholder="e.g. My Golf Club"></div><div class="field"><label>Location</label><input id="course-location" placeholder="Town / region"></div><div class="course-rating-grid"><div class="field"><label>Scratch Rating</label><input id="course-scratch" type="number" step="0.1" value="72"></div><div class="field"><label>Slope Rating</label><input id="course-slope" type="number" min="55" max="155" value="113"></div><div class="field"><label>PCC</label><input id="course-pcc" type="number" min="-1" max="3" step="1" value="0"></div></div><div class="small">Rating data is used for the ParLink handicap estimate. Set par, stroke index and optional green-centre coordinates below.</div><div style="margin-top:12px">${defaultHoles().map(h=>`<div class="course-hole"><div class="num">${h.number}</div><input data-hole-par="${h.number}" type="number" min="3" max="6" value="${h.par}" title="Par"><input data-hole-si="${h.number}" type="number" min="1" max="18" value="${h.si}" title="Stroke index"><button class="btn btn-secondary" data-set-green="${h.number}">GPS</button></div>`).join('')}</div><button class="btn btn-primary" style="width:100%;margin-top:10px" data-action="save-course">Save course</button></div></div>`;render();
}
function saveCourse(){const name=document.getElementById('course-name')?.value.trim();if(!name)return toast('Enter a course name');const holes=defaultHoles().map(h=>({...h,par:Number(document.querySelector(`[data-hole-par="${h.number}"]`)?.value||h.par),si:Number(document.querySelector(`[data-hole-si="${h.number}"]`)?.value||h.si),lat:null,lng:null}));const pending=window.__pendingGreens||{};holes.forEach(h=>{if(pending[h.number]){h.lat=pending[h.number].lat;h.lng=pending[h.number].lng}});state.courses.push({id:uid(),name,location:document.getElementById('course-location')?.value.trim()||'',activated:false,isDemo:false,scratchRating:Number(document.getElementById('course-scratch')?.value||parTotal({holes})),slopeRating:Number(document.getElementById('course-slope')?.value||113),pcc:Number(document.getElementById('course-pcc')?.value||0),holes,createdAt:now()});window.__pendingGreens={};modal=null;save();render();toast('Course added. Activate it with a course credit.')}
function setGreenFromGps(holeNum){if(!navigator.geolocation)return toast('GPS not supported on this device');navigator.geolocation.getCurrentPosition(p=>{window.__pendingGreens=window.__pendingGreens||{};window.__pendingGreens[holeNum]={lat:p.coords.latitude,lng:p.coords.longitude};toast(`Hole ${holeNum} green position saved`)},()=>toast('Could not get GPS position'),{enableHighAccuracy:true,timeout:10000})}
function activateCourse(id){const c=courseById(id);if(!c||c.activated)return;if(creditsLeft()<=0)return toast('No course credits remaining');c.activated=true;save();render();toast(`${c.name} activated`)}
function importCourse(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!data.name||!Array.isArray(data.holes)||data.holes.length!==18)throw new Error();state.courses.push({id:uid(),name:data.name,location:data.location||'',activated:false,isDemo:false,scratchRating:Number(data.scratchRating??data.courseRating??72),slopeRating:Number(data.slopeRating??113),pcc:Number(data.pcc??0),holes:data.holes.map((h,i)=>({number:i+1,par:Number(h.par||4),si:Number(h.si||i+1),lat:h.lat??null,lng:h.lng??null})),createdAt:now()});save();render();toast('Course imported')}catch{toast('Invalid course JSON')}};input.click()}

function editPlayersModal(){modal=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="section-title"><h2>Edit players</h2><button class="icon-btn" data-action="close-modal">✕</button></div><div class="small" style="margin-bottom:12px">Photos make scorecards and leaderboards easier to read. They stay on this device.</div>${state.players.map((p,i)=>`<div class="list-item player-edit-row">${avatarHtml(p)}<div class="player-edit-fields"><input data-pname="${i}" value="${esc(p.name)}"><button class="stat-chip" data-photo-player="${p.id}">${p.photo?'Change photo':'Add photo'}</button>${p.photo?`<button class="stat-chip" data-remove-photo="${p.id}">Remove</button>`:''}</div><input data-phcp="${i}" type="number" min="0" max="54" value="${p.handicap}"></div>`).join('')}<button class="btn btn-primary" style="width:100%;margin-top:12px" data-action="save-players">Save players</button></div></div>`;render()}
function savePlayers(){state.players=state.players.map((p,i)=>({...p,name:document.querySelector(`[data-pname="${i}"]`).value.trim()||p.name,handicap:Number(document.querySelector(`[data-phcp="${i}"]`).value||0)}));state.players.forEach(p=>{if(p.id==='brad'){state.profile.name=p.name;state.profile.handicap=p.handicap;state.profile.officialHandicap=p.handicap;state.profile.photo=p.photo||null}});modal=null;save();render();toast('Players updated')}
function pickPlayerPhoto(playerId){const input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{const file=input.files?.[0];if(!file)return;if(file.size>12*1024*1024)return toast('Choose an image under 12 MB');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const size=256,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);const data=canvas.toDataURL('image/jpeg',.78);const p=playerById(playerId);if(p)p.photo=data;if(playerId==='brad')state.profile.photo=data;save();render();toast('Photo saved on this device')};img.src=reader.result};reader.readAsDataURL(file)};input.click()}
function removePlayerPhoto(playerId){const p=playerById(playerId);if(p)p.photo=null;if(playerId==='brad')state.profile.photo=null;save();render();toast('Photo removed')}
function locateCourse(){if(!navigator.geolocation)return toast('Location is not supported on this device');navigator.geolocation.getCurrentPosition(p=>{gpsPosition={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy};render();const near=nearestCourse();toast(near?`Nearest saved course: ${near.c.name}`:'Location ready for GPS')},()=>toast('Location permission was not granted'),{enableHighAccuracy:true,maximumAge:60000,timeout:12000})}

function enableGps(){if(!navigator.geolocation)return toast('GPS not supported');if(gpsWatchId!=null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;gpsPosition=null;toast('GPS stopped');render();return}gpsWatchId=navigator.geolocation.watchPosition(p=>{gpsPosition={latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy};render()},()=>toast('GPS permission denied'),{enableHighAccuracy:true,maximumAge:3000,timeout:15000});toast('GPS enabled')}

function render(){
  let html;
  switch(state.view){case'play':html=playView();break;case'phantom':html=phantomView();break;case'caddie':html=caddieView();break;case'stats':html=statsView();break;case'mates':html=matesView();break;case'profile':html=profileView();break;default:html=homeView()}
  document.getElementById('app').innerHTML=html+(modal||'');
  bind();
}
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>setView(b.dataset.nav));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setView(b.dataset.go));
  document.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-format]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
  document.querySelectorAll('[data-player-select]').forEach(b=>b.onclick=()=>b.classList.toggle('active'));
  document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>changeScore(b.dataset.score,Number(b.dataset.delta)));
  document.querySelectorAll('[data-activate-course]').forEach(b=>b.onclick=()=>activateCourse(b.dataset.activateCourse));
  document.querySelectorAll('[data-phantom]').forEach(b=>b.onclick=()=>{state.activeRound.phantomRoundId=b.dataset.phantom;modal=null;save();render();toast('Phantom enabled')});
  document.querySelectorAll('[data-set-green]').forEach(b=>b.onclick=()=>setGreenFromGps(Number(b.dataset.setGreen)));
  document.querySelectorAll('[data-share-round]').forEach(b=>b.onclick=()=>openShareRound(b.dataset.shareRound));
  document.querySelectorAll('[data-hole-stats]').forEach(b=>b.onclick=()=>openHoleStats(b.dataset.holeStats));
  document.querySelectorAll('[data-photo-player]').forEach(b=>b.onclick=()=>pickPlayerPhoto(b.dataset.photoPlayer));
  document.querySelectorAll('[data-remove-photo]').forEach(b=>b.onclick=()=>removePlayerPhoto(b.dataset.removePhoto));
  document.querySelectorAll('[data-edit-group]').forEach(b=>b.onclick=()=>newGroupModal(b.dataset.editGroup));
  document.querySelectorAll('[data-manage-open-round]').forEach(b=>b.onclick=()=>manageOpenRound(b.dataset.manageOpenRound));
  document.querySelectorAll('[data-share-open-round]').forEach(b=>b.onclick=()=>shareOpenRound(b.dataset.shareOpenRound));
  document.querySelectorAll('[data-calendar-open-round]').forEach(b=>b.onclick=()=>calendarOpenRound(b.dataset.calendarOpenRound));
  document.querySelectorAll('[data-start-open-round]').forEach(b=>b.onclick=()=>startOpenRound(b.dataset.startOpenRound));
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=(e)=>{const a=b.dataset.action;actions[a]?.(e)});
}
const actions={
  'start-round':startRound,'prev-hole':prevHole,'next-hole':nextHole,'finish-round':finishRound,
  'abandon-round':()=>{if(confirm('Abandon this round?')){state.activeRound=null;save();render()}},
  'gps':enableGps,'locate-course':locateCourse,'enable-phantom':enablePhantom,'round-caddie':roundCaddie,'save-hole-stats':saveHoleStats,
  'close-modal':()=>{modal=null;render()},'new-course':newCourseModal,'save-course':saveCourse,'import-course':importCourse,
  'edit-players':editPlayersModal,'save-players':savePlayers,
  'new-group':()=>newGroupModal(),'save-group':saveGroup,'delete-group':deleteGroup,
  'new-open-round':newOpenRoundModal,'save-open-round':saveOpenRound,'save-open-statuses':saveOpenStatuses,'delete-open-round':deleteOpenRound,
  'save-social-profile':()=>{state.profile.suburb=document.getElementById('profile-suburb')?.value.trim()||'';state.profile.homeCourse=document.getElementById('profile-home-course')?.value.trim()||'';state.profile.playingStyle=document.getElementById('profile-style')?.value||'Social';state.profile.availability=[...document.querySelectorAll('[data-availability]:checked')].map(x=>x.dataset.availability);state.profile.discoverable=!!document.getElementById('profile-discoverable')?.checked;state.profile.showHandicap=!!document.getElementById('profile-show-hcp')?.checked;save();toast('Social profile saved')},
  'save-profile':()=>{state.profile.name=document.getElementById('profile-name').value.trim()||state.profile.name;state.profile.officialHandicap=Number(document.getElementById('profile-hcp').value||0);state.profile.handicap=Math.round(state.profile.officialHandicap);const p=state.players.find(x=>x.id==='brad');if(p){p.name=state.profile.name;p.handicap=state.profile.handicap;p.photo=state.profile.photo||p.photo||null}save();toast('Profile saved')},
  'save-clubs':()=>{state.profile.clubs=state.profile.clubs.map((c,i)=>({name:document.querySelector(`.club-name[data-i="${i}"]`).value.trim()||c.name,carry:Number(document.querySelector(`.club-carry[data-i="${i}"]`).value||0)}));save();toast('Club distances saved')},
  'add-club':()=>{state.profile.clubs.push({name:'New club',carry:100});save();render()},
  'caddie-recommend':()=>{const d=Number(document.getElementById('caddie-distance').value||0);document.getElementById('caddie-result').innerHTML=caddieRecommendation(d)},
  'toggle-gpsplus':()=>{state.gpsPlus=!state.gpsPlus;save();render();toast(state.gpsPlus?'GPS+ demo enabled':'GPS+ demo disabled')},
  'share-native':shareNative,'save-share-card':saveShareCard,'copy-share-text':copyShareText,
  'reset-app':()=>{if(confirm('Delete all ParLink V1.4 data on this device?')){localStorage.removeItem(APP_KEY);state=structuredClone(initialState);render();toast('ParLink V1.4 reset')}},
  'install':async()=>{if(window.__deferredPrompt){window.__deferredPrompt.prompt();await window.__deferredPrompt.userChoice;window.__deferredPrompt=null}else toast('Use your browser menu → Add to Home screen')}
};

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__deferredPrompt=e});
// Service worker disabled in native Android wrapper; assets are bundled offline.
render();

// Register ParLink service worker for installed/PWA updates.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
    } catch (_) {}
  });
}

  </script>
</body>
</html>
